name: Build Pterodactyl Android APK

on:
  push:
    branches: ["pterodactyl-native-app"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore supplied launcher image
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat .source/icon-part-*.b64 | base64 --decode > app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          file app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          echo '20abbd57d9a6ac39ac0387441c84c82b8f529236bd1c8bf862507058f4b28be6  app/src/main/res/drawable-nodpi/ic_launcher_foreground.png' | sha256sum --check

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pterodactyl-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
