name: Build Termux APK

on:
  push:
    branches: [termux-apk]
    paths:
      - 'termux-custom/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: 8629e632fcb95da272221be327db653fb24befe9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom files
        uses: actions/checkout@v4
        with:
          ref: termux-apk
          path: custom

      - name: Checkout upstream Termux
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: ${{ env.UPSTREAM_SHA }}
          path: termux-app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply custom patch
        working-directory: termux-app
        run: git apply --check ../custom/termux-custom/custom.patch && git apply ../custom/termux-custom/custom.patch

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          base64 -d custom/termux-custom/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Build APK
        working-directory: termux-app
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APK_VERSION_TAG: custom-${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-custom-apk
          path: termux-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: termux-custom-${{ github.run_number }}
          name: Termux custom build ${{ github.run_number }}
          files: termux-app/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
